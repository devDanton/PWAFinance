name: Supabase Keep-Alive

on:
  schedule:
    # Executa todos os dias às 06:00 UTC (03:00 de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite disparar manualmente pela aba Actions do GitHub

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request to Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ Erro: Configure as secrets SUPABASE_URL e SUPABASE_ANON_KEY nas configurações do repositório (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          echo "Pinging Supabase REST API..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/workspaces?select=id&limit=1")

          echo "HTTP Status: $HTTP_STATUS"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "✅ Supabase pinged successfully! Database activity registered."
          else
            echo "❌ Failed to ping Supabase (HTTP $HTTP_STATUS)."
            exit 1
          fi
